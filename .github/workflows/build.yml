name: SuvidhaPOS Premium Windows Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic build fixes
        shell: powershell
        run: .\fixes\apply-build-fixes.ps1
      - name: Generate branded SuvidhaPOS Windows icon
        shell: powershell
        run: '& ''installer/Generate-AppIcon.ps1'''
      - name: Validate original SuvidhaPOS branding
        shell: powershell
        run: |
          $html=Get-Content 'src/SuvidhaPOS-Premium/wwwroot/index.html' -Raw -Encoding UTF8
          if($html.Contains('<div class="brandmark">SP</div>')){throw 'Legacy SP initials tile is still present'}
          if(-not $html.Contains('/img/suvidha-pos-mark.svg')){throw 'Sidebar original SuvidhaPOS logo mark is missing'}
          $mark=Get-Content 'src/SuvidhaPOS-Premium/wwwroot/img/suvidha-pos-mark.svg' -Raw -Encoding UTF8
          if(-not $mark.Contains('data:image/png;base64,')){throw 'Cropped mark must reuse the original logo asset'}
          $ico=Get-Item 'src/SuvidhaPOS-Premium/suvidha-pos.ico'
          if($ico.Length -lt 5000){throw "Windows icon is too small/low quality: $($ico.Length) bytes"}
          $bytes=[IO.File]::ReadAllBytes($ico.FullName)
          $count=[BitConverter]::ToUInt16($bytes,4)
          if($count -lt 7){throw "Expected multi-size Windows icon, found $count image(s)"}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate deterministic retail parsing and price rules
        run: dotnet run --project fixes/RetailPurchaseChecks --configuration Release
      - name: Validate purchase BTC day-close fixes
        shell: powershell
        run: |
          $purchase = Get-Content 'src/SuvidhaPOS-Premium/PurchaseImportModules.cs' -Raw -Encoding UTF8
          $sp = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/js/specialized-pos.js' -Raw -Encoding UTF8
          $btcReceipt = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/js/btc-settlement.js' -Raw -Encoding UTF8
          $btcFlow = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/js/btc-payment-receipt-flow.js' -Raw -Encoding UTF8
          $bill = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/js/bill-management-fixes-20260911.js' -Raw -Encoding UTF8
          $features = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/js/sidebar-feature-control.js' -Raw -Encoding UTF8
          $day = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/js/day-close-auto.js' -Raw -Encoding UTF8
          $dayApi = Get-Content 'src/SuvidhaPOS-Premium/DayCloseAutomationModules.cs' -Raw -Encoding UTF8
          $html = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/index.html' -Raw -Encoding UTF8
          foreach($token in @('/api/purchase-import/preview','/api/purchase-import/commit','/api/purchase-import/template','/api/purchase-import/bill-template','HSSFWorkbook','barcode and item name match different existing items')){if(-not $purchase.Contains($token)){throw "Purchase import missing: $token"}}
          foreach($token in @('barcode-purchase-full','Temp Save','Get Temp Data','Import Excel','Import Bill','BARCODE / SKU / ITEM NAME','Sample Bill Format','barcodePurchaseCommitImport')){if(-not $sp.Contains($token)){throw "Barcode Purchase fix missing: $token"}}
          foreach($token in @("desktopPrintHtml(html,'DIRECT'","Print Receipt")){if(-not $btcReceipt.Contains($token)){throw "BTC receipt print fix missing: $token"}}
          foreach($token in @('btcPrOpenCardUpi','Card / UPI Payment','btcPrUseCardUpi')){if(-not $btcFlow.Contains($token)){throw "BTC Card/UPI detail missing: $token"}}
          foreach($token in @('bmSaveModifyAndPrint','Save & Print','bmReprint','Changed during bill modification')){if(-not $bill.Contains($token)){throw "Bill modify/reprint fix missing: $token"}}
          foreach($token in @('New Billing / Jewellery Billing','Item Master','Purchases','Bill Management','BTC / Credit Settlement','Customer / Company','Barcode Print Master','Print Master','Database Backup')){if(-not $features.Contains($token)){throw "Sidebar Feature Control missing: $token"}}
          foreach($token in @('Confirm Day Close & Shift End ?','DayClose.Auto','auto-run')){if(-not ($day+$dayApi).Contains($token)){throw "Day Close fix missing: $token"}}
          foreach($token in @('/js/sidebar-feature-control.js','/js/day-close-auto.js')){if(-not $html.Contains($token)){throw "Runtime script missing: $token"}}
          foreach($token in @('data-page="aiimport"','data-page="itemimport"','data-page="openingstock"')){if($html.Contains($token)){throw "Top-level Item Master child returned: $token"}}
          $wf = Get-Content '.github/workflows/build.yml' -Raw -Encoding UTF8
          if($wf -match '(?m)^concurrency:'){throw 'Workflow cancellation/supersede concurrency gate must remain removed'}
          node --check 'src/SuvidhaPOS-Premium/wwwroot/js/specialized-pos.js'
          node --check 'src/SuvidhaPOS-Premium/wwwroot/js/btc-settlement.js'
          node --check 'src/SuvidhaPOS-Premium/wwwroot/js/btc-payment-receipt-flow.js'
          node --check 'src/SuvidhaPOS-Premium/wwwroot/js/bill-management-fixes-20260911.js'
          node --check 'src/SuvidhaPOS-Premium/wwwroot/js/sidebar-feature-control.js'
          node --check 'src/SuvidhaPOS-Premium/wwwroot/js/day-close-auto.js'

      - name: Restore
        run: dotnet restore SuvidhaPOS-Premium.sln
      - name: Build
        run: dotnet build SuvidhaPOS-Premium.sln --configuration Release --no-restore
      - name: Validate jewellery workflow rules
        run: dotnet run --project fixes/JewelleryWorkflowChecks --configuration Release
      - name: Validate source layout
        shell: powershell
        run: |
          $required=@('src/SuvidhaPOS-Premium/Program.cs','src/SuvidhaPOS-Premium/SpecializedModules.cs','src/SuvidhaPOS-Premium/PremiumFeatureModules.cs','src/SuvidhaPOS-Premium/PremiumCompletionModules.cs','src/SuvidhaPOS-Premium/wwwroot/js/premium-masters.js','src/SuvidhaPOS-Premium/wwwroot/js/premium-completion.js','src/SuvidhaPOS-Premium/wwwroot/css/premium-completion.css','src/SuvidhaPOS-Premium/Database/completion-schema.sql','src/SuvidhaPOS-Premium/wwwroot/js/outlet-login-sync.js','src/SuvidhaPOS-Premium/wwwroot/js/jewellery-suite.js','src/SuvidhaPOS-Premium/wwwroot/css/jewellery-suite.css','src/SuvidhaPOS-Premium/wwwroot/css/premium-masters.css','src/SuvidhaPOS-Premium/SuvidhaPOS.Premium.csproj','src/SuvidhaPOS-Premium/Database/schema.sql','src/SuvidhaPOS-Premium/Database/specialized-schema.sql','src/SuvidhaPOS-Premium/Database/seed.sql','src/SuvidhaPOS-Premium/Database/print-schema.sql','src/SuvidhaPOS-Premium/wwwroot/index.html','src/SuvidhaPOS-Premium/wwwroot/js/app.js','src/SuvidhaPOS-Premium/wwwroot/js/login-authfix7.js','src/SuvidhaPOS-Premium/wwwroot/js/desktop-bridge.js','src/SuvidhaPOS-Premium/wwwroot/js/pos-fixes.js','src/SuvidhaPOS-Premium/wwwroot/js/specialized-pos.js','src/SuvidhaPOS-Premium/wwwroot/js/backup-master.js','src/SuvidhaPOS-Premium/wwwroot/css/app.css','src/SuvidhaPOS-Premium/wwwroot/css/login-premium.css','src/SuvidhaPOS-Premium/wwwroot/css/backup-master.css','src/SuvidhaPOS-Premium/wwwroot/css/premium-fixes.css','src/SuvidhaPOS-Premium/suvidha-pos.ico','src/SuvidhaPOS-Premium/wwwroot/img/suvidha-pos-mark.svg','installer/Generate-AppIcon.ps1','installer/Ensure-SqlAccess.ps1','src/SuvidhaPOS.Desktop/SuvidhaPOS.Desktop.csproj','src/SuvidhaPOS.Desktop/Program.cs','src/SuvidhaPOS.Desktop/MainForm.cs','src/SuvidhaPOS.Desktop/Database.config.json','installer/SuvidhaPOS.iss'); foreach($f in $required){if(-not(Test-Path $f)){throw "Missing $f"}}
      - name: Validate sales trigger compatibility and report master
        shell: powershell
        run: |
          $premium = Get-Content 'src/SuvidhaPOS-Premium/PremiumFeatureModules.cs' -Raw -Encoding UTF8
          $program = Get-Content 'src/SuvidhaPOS-Premium/Program.cs' -Raw -Encoding UTF8
          if ($premium -match 'INSERT Sales[\\s\\S]{0,500}OUTPUT INSERTED') { throw 'Premium Sales insert is not trigger-safe' }
          if ($program -match 'INSERT Sales[\\s\\S]{0,500}OUTPUT INSERTED') { throw 'Standard Sales insert is not trigger-safe' }
          $reports = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/js/reports-suite.js' -Raw -Encoding UTF8
          $required = @('Account Report','Daily Sale Report Bill Wise','Cashier Report','Date Wise Summary','Bill Modification Report','Utility Report','Item Wise Report','Profit & Loss Report','Date Wise Sale Summary Report','Bill/Customer Report','Category Wise Sale Report','Category Wise Monthly Sale Report','HSN Wise Sale Report','Purchase Register Report','Bill Detail Report','Qty Wise Report','Product Expiry Report','GSTR1','Current Stock Report')
          foreach($name in $required){ if(-not $reports.Contains($name)){ throw "Missing report: $name" } }
          $optionCount = ([regex]::Matches($reports, "\['[^']+','[^']+'\]")).Count
          if($optionCount -ne 19){ throw "Expected 19 premium report options, found $optionCount" }
          $html = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/index.html' -Raw -Encoding UTF8
          if($html.Contains('legacy-report-suite.js') -or $html.Contains('legacy-report-boot.js')){ throw 'Legacy report override is still loaded' }
      - name: Validate central-only Store Type and jewellery normalization
        shell: powershell
        run: |
          $outlet = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/js/outlet-master-fix.js' -Raw -Encoding UTF8
          if($outlet.Contains('const TYPES=')){ throw 'POS must not keep an editable Store Type master' }
          foreach($token in @('id="otype"','readonly','Managed from SuvidhaPremium website','Store Type remains managed by SuvidhaPremium')){ if(-not $outlet.Contains($token)){ throw "Central-only Store Type UI missing: $token" } }
          $program = Get-Content 'src/SuvidhaPOS-Premium/Program.cs' -Raw -Encoding UTF8
          foreach($token in @('LicenseGuardModules.GetStatus().StoreType','storeTypeManagedBy="SuvidhaPremium"','app.MapGet("/api/outlet-types"')){ if(-not $program.Contains($token)){ throw "Central-only Store Type backend missing: $token" } }
          $special = Get-Content 'src/SuvidhaPOS-Premium/SpecializedModules.cs' -Raw -Encoding UTF8
          if(-not $special.Contains('LicenseGuardModules.GetStatus().StoreType')){ throw 'Specialization does not prefer signed central Store Type' }
          $schema = Get-Content 'src/SuvidhaPOS-Premium/Database/specialized-schema.sql' -Raw -Encoding UTF8
          if(-not $schema.Contains("StoreType IN ('Gold & Diamond Jewellery','Silver Jewellery')")){ throw 'Legacy jewellery type normalization migration missing' }
      - name: Validate 19-report tile master and outlet mode switching
        shell: powershell
        run: |
          $reports = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/js/reports-suite.js' -Raw -Encoding UTF8
          foreach($token in @('normal-report-grid','normal-report-tile','openNormalReport','Business Reports','19 premium business reports','data-no-tax-enhance="1"')){ if(-not $reports.Contains($token)){ throw "Premium report tile master missing: $token" } }
          $defs = ([regex]::Matches($reports,"\['[^']+','[^']+'\]")).Count
          if($defs -lt 19){ throw "Expected all 19 normal reports, found $defs" }
          $tax = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/js/tax-master.js' -Raw -Encoding UTF8
          if(-not $tax.Contains("el.id==='reportType'")){ throw 'Hidden report selector tax exclusion missing' }
          $outlet = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/js/outlet-master-fix.js' -Raw -Encoding UTF8
          if(-not $outlet.Contains("location.replace('/?outlet='")){ throw 'Outlet save does not force workspace reload' }
          $sync = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/js/outlet-login-sync.js' -Raw -Encoding UTF8
          if(-not $sync.Contains("suvidha:outlet-saved")){ throw 'Login outlet live sync event missing' }
          $jewel = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/js/jewellery-suite.js' -Raw -Encoding UTF8
          if(-not $jewel.Contains("suvidha:outlet-synced")){ throw 'Jewellery mode outlet sync listener missing' }
          if(-not $jewel.Contains("window.loadBilling=()=>invoice('retail')")){ throw 'Jewellery billing override missing' }
      - name: Validate P-01 through P-20 completion
        shell: powershell
        run: |
          $backend = Get-Content 'src/SuvidhaPOS-Premium/PremiumCompletionModules.cs' -Raw -Encoding UTF8
          $ui = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/js/premium-completion.js' -Raw -Encoding UTF8
          $schema = Get-Content 'src/SuvidhaPOS-Premium/Database/completion-schema.sql' -Raw -Encoding UTF8
          $program = Get-Content 'src/SuvidhaPOS-Premium/Program.cs' -Raw -Encoding UTF8
          $counter = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/js/counter-billing.js' -Raw -Encoding UTF8
          $premium = Get-Content 'src/SuvidhaPOS-Premium/PremiumFeatureModules.cs' -Raw -Encoding UTF8
          $print = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/js/print-settings.js' -Raw -Encoding UTF8
          $bridge = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/js/desktop-bridge.js' -Raw -Encoding UTF8
          $desktop = Get-Content 'src/SuvidhaPOS.Desktop/MainForm.cs' -Raw -Encoding UTF8
          $html = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/index.html' -Raw -Encoding UTF8

          1..20 | ForEach-Object {
            $code = 'P-' + $_.ToString('00')
            if(-not $schema.Contains("('$code'")){ throw "Feature flag seed missing: $code" }
          }
          foreach($token in @('/api/jewellery/item-master','PremiumJewelleryItemRequest','FineWeight','WastagePercent','HallmarkStatus','JewelleryItemStones','CertificateNo')){ if(-not $backend.Contains($token)){ throw "P-01/P-08 backend missing: $token" } }
          foreach($token in @('/api/jewellery/sales/complete','/api/jewellery/vouchers','JewellerySalePayments','JewelleryOldMetalEntries','PremiumOverrideAudit')){ if(-not $backend.Contains($token)){ throw "P-02/P-13/P-14/P-16 backend missing: $token" } }
          foreach($token in @('N20','J10','Barcode Print Master','Code39','barcode-print/log','Barcode.PrinterName')){ if(-not $ui.Contains($token)){ throw "P-03/P-17 barcode master missing: $token" } }
          foreach($token in @('/api/outlet/sync','/public/outlet/profile-sync','2500','OutletSyncLog','premiumManualOutletSync','startup','login','save')){ if(-not ($backend+$ui).Contains($token)){ throw "P-04/P-10 outlet sync missing: $token" } }
          foreach($token in @('Normal Item Import Master','Jewellery Item Import Master','downloadNormalItemSample','downloadJewelleryItemSample','916','22K','INCLUSIVE','EXCLUSIVE','SKIP','UPDATE','CREATE','ItemImportJobs','ItemImportConflicts')){ if(-not ($backend+$ui+$schema).Contains($token)){ throw "P-05/P-06/P-07/P-18/P-19 import feature missing: $token" } }
          foreach($token in @('PremiumFeatureFlags','/api/premium/features','Feature Control')){ if(-not ($backend+$ui+$schema).Contains($token)){ throw "P-20 feature control missing: $token" } }
          foreach($token in @('TaxMode','INCLUSIVE','beforeDiscount')){ if(-not ($counter+$premium+$program).Contains($token)){ throw "Inclusive/exclusive normal billing missing: $token" } }
          foreach($token in @('Print.ActionMode','Direct Print','Save to PDF','Preview & Print')){ if(-not ($ui+$print).Contains($token)){ throw "Three bill print actions missing: $token" } }
          foreach($token in @('desktopPrintHtml','printHtml')){ if(-not ($bridge+$desktop).Contains($token)){ throw "Desktop print bridge missing: $token" } }
          foreach($token in @('PrintAsync(null)','PrintToPdfAsync','ShowPrintUI')){ if(-not $desktop.Contains($token)){ throw "Native print action missing: $token" } }
          foreach($token in @('premium-completion.js','premium-completion.css','Version 6.12.0-complete')){ if(-not $html.Contains($token)){ throw "Completion runtime asset missing: $token" } }
          if(-not $program.Contains('PremiumCompletionModules.Map(app)')){ throw 'PremiumCompletionModules is not mapped' }
          if(-not $program.Contains('mode=="jewellery-items"')){ throw 'Jewellery import extraction mode missing' }
          if(-not $program.Contains('p.TaxMode')){ throw 'Normal product TaxMode is not exposed' }
          if(-not $premium.Contains("sl.TaxMode='INCLUSIVE'")){ throw 'GST reports are not inclusive-tax aware' }
      - name: Validate retail expansion points 1-12
        shell: powershell
        run: |
          $backend = Get-Content 'src/SuvidhaPOS-Premium/RetailExpansionModules.cs' -Raw -Encoding UTF8
          $ui = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/js/retail-masters-ui.js' -Raw -Encoding UTF8
          $geo = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/js/india-locations.js' -Raw -Encoding UTF8
          $outlet = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/js/outlet-master-fix.js' -Raw -Encoding UTF8
          $sync = Get-Content 'src/SuvidhaPOS-Premium/PremiumCompletionModules.cs' -Raw -Encoding UTF8
          $btc = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/js/btc-payment-receipt-flow.js' -Raw -Encoding UTF8
          $btcBill = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/js/btc-settlement.js' -Raw -Encoding UTF8
          $audit = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/js/audit-report-thermal.js' -Raw -Encoding UTF8
          $auditCss = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/css/audit-report-thermal.css' -Raw -Encoding UTF8
          $premium = Get-Content 'src/SuvidhaPOS-Premium/PremiumFeatureModules.cs' -Raw -Encoding UTF8
          $counter = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/js/counter-billing.js' -Raw -Encoding UTF8
          $schema = Get-Content 'src/SuvidhaPOS-Premium/Database/retail-expansion-schema.sql' -Raw -Encoding UTF8
          $project = Get-Content 'src/SuvidhaPOS-Premium/SuvidhaPOS.Premium.csproj' -Raw -Encoding UTF8
          foreach($f in @('src/SuvidhaPOS-Premium/RetailExpansionModules.cs','src/SuvidhaPOS-Premium/wwwroot/js/retail-masters-ui.js','src/SuvidhaPOS-Premium/wwwroot/js/india-locations.js','src/SuvidhaPOS-Premium/wwwroot/js/audit-report-thermal.js','src/SuvidhaPOS-Premium/wwwroot/css/audit-report-thermal.css','src/SuvidhaPOS-Premium/Database/retail-expansion-schema.sql')){if(-not(Test-Path $f)){throw "Retail expansion file missing: $f"}}
          foreach($token in @('/api/retail/opening-stock/preview','/api/retail/item-rates/preview','/api/retail/item-rates/apply','/api/retail/customer-company','/api/btc/advance','/api/reports/btc-payments','/api/reports/audit-summary')){if(-not $backend.Contains($token)){throw "Retail expansion endpoint missing: $token"}}
          foreach($token in @('Item Entry','Category Entry','Item Import','Bulk Edit Update','Item Rate Update','Opening Stock Bulk Update','Select Visible','Select Multiple Items','Post Selected Opening Stock','BTC Payment Report','Customer / Company')){if(-not $ui.Contains($token)){throw "Retail master UI missing: $token"}}
          foreach($token in @('Andaman and Nicobar Islands','Arunachal Pradesh','Jammu and Kashmir','Ladakh','Lakshadweep','Uttar Pradesh','West Bengal','suvidhaBindIndiaLocation','suvidhaIndiaCityCatalogCount=')){if(-not $geo.Contains($token)){throw "India State/City helper missing: $token"}}
          if($geo -notmatch 'suvidhaIndiaCityCatalogCount=(\d+)'){throw 'India city catalog count missing'}
          if([int]$Matches[1] -lt 1500){throw "India city catalog is too small: $($Matches[1])"}
          foreach($token in @('id="ostate"','id="ocity"','State:','City:')){if(-not $outlet.Contains($token)){throw "Outlet State/City UI missing: $token"}}
          foreach($token in @('State,City','S("state")','S("city")')){if(-not $sync.Contains($token)){throw "Outlet State/City central sync missing: $token"}}
          foreach($token in @('ADVANCE RECEIPT','Advance Amount','Credit/UPI','Partial Settlement','btcPrSetSettlementKind')){if(-not $btc.Contains($token)){throw "BTC advance/partial settlement UI missing: $token"}}
          foreach($token in @('btcBillingAdvance','btcBillingAdvanceMode','Submit')){if(-not $btcBill.Contains($token)){throw "BTC billing company advance/submit flow missing: $token"}}
          foreach($token in @('btcRptMode','mode=','All Modes','/api/reports/btc-payments')){if(-not $ui.Contains($token)){throw "BTC Payment Report filter missing: $token"}}
          if(-not $backend.Contains('string? type, string? mode')){throw 'BTC Payment Report backend payment-mode filter missing'}
          foreach($token in @('Thermal Print 80mm','Audit Report - Account Summary','Payment Break up','Cashier Report','* End of Reports *','data-audit-thermal-report','injectAuditTile')){if(-not $audit.Contains($token)){throw "Thermal Audit Report missing: $token"}}
          if(-not $audit.Contains('@page{size:80mm auto')){throw '80mm thermal print page rule missing'}
          foreach($token in @('PdfPig','ContentOrderTextExtractor','ext == ".pdf"','ParsePdfTable')){if(-not ($project+$backend).Contains($token)){throw "Local PDF rate import missing: $token"}}
          foreach($token in @('CustomerPhone','CustomerGstIn','INSERT Customers')){if(-not $premium.Contains($token)){throw "Billing customer auto-save backend missing: $token"}}
          foreach($token in @('CustomerPhone:','CustomerGstIn:')){if(-not $counter.Contains($token)){throw "Billing customer auto-save payload missing: $token"}}
          foreach($token in @('BtcAdvances','OutletMaster','State','City','FK_BtcAdvances_Companies','UX_BtcAdvances_ReceiptNo')){if(-not $schema.Contains($token)){throw "Retail expansion schema missing: $token"}}
          node --check 'src/SuvidhaPOS-Premium/wwwroot/js/retail-masters-ui.js'
          node --check 'src/SuvidhaPOS-Premium/wwwroot/js/india-locations.js'
          node --check 'src/SuvidhaPOS-Premium/wwwroot/js/btc-payment-receipt-flow.js'
          node --check 'src/SuvidhaPOS-Premium/wwwroot/js/btc-settlement.js'
          node --check 'src/SuvidhaPOS-Premium/wwwroot/js/audit-report-thermal.js'
      - name: Validate base-unit multi-unit inventory
        shell: powershell
        run: |
          $schema = Get-Content 'src/SuvidhaPOS-Premium/Database/specialized-schema.sql' -Raw -Encoding UTF8
          foreach($token in @('InnerUnit','InnerConversionFactor','PackInnerFactor','UnitPurchased','TotalBaseQty','UnitSold','TotalBaseQtyDeducted')){ if(-not $schema.Contains($token)){ throw "Missing UOM schema token: $token" } }
          $premium = Get-Content 'src/SuvidhaPOS-Premium/PremiumFeatureModules.cs' -Raw -Encoding UTF8
          if(-not $premium.Contains('ResolvedPremiumSaleLine')){ throw 'Server-side sale UOM resolver missing' }
          if(-not $premium.Contains('public record ResolvedPremiumSaleLine')){ throw 'ResolvedPremiumSaleLine record declaration missing' }
          if(-not $premium.Contains('TotalBaseQtyDeducted')){ throw 'Sale base quantity audit missing' }
          $counter = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/js/counter-billing.js' -Raw -Encoding UTF8
          if(-not $counter.Contains('BaseQty:x.Qty*x.Factor')){ throw 'Counter billing does not submit base quantity' }
          if(-not $counter.Contains("UnitSold:x.Uom")){ throw 'Counter billing sold unit audit missing' }
          $special = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/js/specialized-pos.js' -Raw -Encoding UTF8
          if(-not $special.Contains('Inner Unit (optional)')){ throw 'Three-level UOM item master missing' }
          if(-not $special.Contains('UnitPurchased:x.Unit')){ throw 'Purchase UOM audit missing' }
          if(-not $special.Contains('Batch No is mandatory for Pharmacy / Medical Store')){ throw 'Pharmacy batch validation missing' }
      - name: Validate runtime navigation and backup session recovery
        shell: powershell
        run: |
          $app = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/js/app.js' -Raw -Encoding UTF8
          foreach($token in @('navigateFromSidebar','sidebar.addEventListener','Session expired. Please login again.','sessionStorage.removeItem')){ if(-not $app.Contains($token)){ throw "Runtime navigation/session recovery missing: $token" } }
          $backup = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/js/backup-master.js' -Raw -Encoding UTF8
          foreach($token in @('sessionStorage.getItem','credentials:''same-origin''','Backup settings API failed','return false')){ if(-not $backup.Contains($token)){ throw "Backup session recovery missing: $token" } }
          if($backup.Contains("localStorage.getItem('suvidha_token')")){ throw 'Backup Log still uses obsolete auth token storage' }
          $html = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/index.html' -Raw -Encoding UTF8
          if(-not $html.Contains('runtimeInputGuard')){ throw 'Authenticated input guard missing' }
          $iss = Get-Content 'installer/SuvidhaPOS.iss' -Raw -Encoding UTF8
          if(-not $iss.Contains('runasoriginaluser')){ throw 'Post-install app must launch as normal desktop user' }
      - name: Validate premium completion JavaScript runtime syntax
        shell: powershell
        run: |
          node --check 'src/SuvidhaPOS-Premium/wwwroot/js/premium-completion.js'
