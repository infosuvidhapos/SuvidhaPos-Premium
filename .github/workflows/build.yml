          if(-not $outletUi.Contains('lic.validTill')){ throw 'Outlet Validity must be camelCase tolerant' }
          if($outletUi.Contains('Outlet Code<input')){ throw 'Outlet Code must not appear as an extra locked Outlet Master field' }
          $jewel = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/js/jewellery-suite.js' -Raw -Encoding UTF8
          if(-not $jewel.Contains("prop(s,'StoreType','storeType')")){ throw 'Jewellery mode profile is not camelCase tolerant' }
          $app = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/js/app.js' -Raw -Encoding UTF8
          if($app.Contains('disabled title="Configure OpenAI API key first"')){ throw 'AI extract is still silently disabled on config status failure' }
          if(-not $app.Contains('id="aiExtractBtn"')){ throw 'AI extract runtime control missing' }
      - name: Validate Bill Management Master stock safety
        shell: powershell
        run: |
          $bill = Get-Content 'src/SuvidhaPOS-Premium/BillManagementModules.cs' -Raw -Encoding UTF8
          foreach($token in @('/api/bill-master','/api/sales/{id:int}/bill','/api/sales/{id:int}/payment-mode','BILL_EDIT_RESTORE','BILL_MODIFY_RESTORE','UPDATE ProductBatches SET Quantity=Quantity+@q','UPDATE ProductBatches SET Quantity=Quantity-@q','DELETE FROM SaleLines WHERE SaleId=@id','BILL_PAYMENT_CHANGED')){ if(-not $bill.Contains($token)){ throw "Bill Master backend missing: $token" } }
          $ui = Get-Content 'src/SuvidhaPOS-Premium/wwwroot/js/bill-master.js' -Raw -Encoding UTF8
          foreach($token in @('Reprint Bill','Edit Bill','Modify Bill','Cancel Bill','Payment Mode Change','Stock will be restored and recalculated transactionally.')){ if(-not $ui.Contains($token)){ throw "Bill Master UI missing: $token" } }
          $schema = Get-Content 'src/SuvidhaPOS-Premium/Database/specialized-schema.sql' -Raw -Encoding UTF8
          if(-not $schema.Contains('LastModificationType')){ throw 'Bill modification audit schema missing' }
      - name: Download SQL Server 2019 Express prerequisite
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path installer/Prerequisites | Out-Null
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/7/f/8/7f8a9c43-8c8a-4f7c-9f92-83c18d96b681/SQL2019-SSEI-Expr.exe' -OutFile installer/Prerequisites/SQL2019-SSEI-Expr.exe
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/7/c/1/7c14e92e-bdcb-4f89-b7cf-93543e7112d1/SQLEXPR_x64_ENU.exe' -OutFile installer/Prerequisites/SQL2019-SQLEXPR_x64_ENU.exe
      - name: Download WebView2 prerequisite
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path installer/Prerequisites | Out-Null
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?linkid=2124703' -OutFile installer/Prerequisites/MicrosoftEdgeWebview2Setup.exe
      - name: Publish backend
        run: dotnet publish src/SuvidhaPOS-Premium/SuvidhaPOS.Premium.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/win-x64
      - name: Publish desktop
        run: dotnet publish src/SuvidhaPOS.Desktop/SuvidhaPOS.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/desktop/win-x64
      - name: Assemble desktop application
        shell: powershell
        run: |
          Copy-Item 'publish/win-x64/*' 'publish/desktop/win-x64' -Recurse -Force
          foreach($f in @('publish/desktop/win-x64/SuvidhaPOS.Desktop.exe','publish/desktop/win-x64/SuvidhaPOS.Premium.exe','publish/desktop/win-x64/Database/specialized-schema.sql','publish/desktop/win-x64/Database/print-schema.sql')){if(-not(Test-Path $f)){throw "Missing publish file $f"}}
      - name: Create and verify SQL Server 2019 compatible backup
        shell: powershell
        run: |
          $sql2019='installer/Prerequisites/SQL2019-SQLEXPR_x64_ENU.exe'
          $arguments='/Q /ACTION=Install /IACCEPTSQLSERVERLICENSETERMS /FEATURES=SQLENGINE /INSTANCENAME=SQLEXPRESS2019 /SQLSVCACCOUNT="NT AUTHORITY\SYSTEM" /SQLSYSADMINACCOUNTS="BUILTIN\ADMINISTRATORS" /TCPENABLED=1 /NPENABLED=1 /SQLSVCSTARTUPTYPE=Automatic /UPDATEENABLED=0'
          $p=Start-Process -FilePath $sql2019 -ArgumentList $arguments -Wait -PassThru
          if($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010){throw "SQL Server 2019 Express installation failed with exit code $($p.ExitCode)"}
          Start-Service 'MSSQL$SQLEXPRESS2019' -ErrorAction SilentlyContinue
          choco install sqlserver-cmdlineutils --version=15.0.4298.100 --yes --no-progress
          $sqlcmd=Get-ChildItem 'C:\Program Files\Microsoft SQL Server\Client SDK\ODBC\*\Tools\Binn\sqlcmd.exe','C:\Program Files (x86)\Microsoft SQL Server\Client SDK\ODBC\*\Tools\Binn\sqlcmd.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if($null -eq $sqlcmd){throw 'sqlcmd missing'}
          $server='.\SQLEXPRESS2019'
          & $sqlcmd.FullName -I -S $server -E -b -Q "SELECT @@VERSION; SELECT SERVERPROPERTY('ProductVersion') AS ProductVersion, SERVERPROPERTY('ProductLevel') AS ProductLevel, SERVERPROPERTY('Edition') AS Edition;"
          if($LASTEXITCODE -ne 0){throw 'SQL Server 2019 connection failed'}
          New-Item -ItemType Directory -Force -Path database-artifact | Out-Null
          foreach($script in @('schema.sql','specialized-schema.sql','print-schema.sql','jewellery-registers-schema.sql','seed.sql')){
            & $sqlcmd.FullName -I -S $server -E -b -i "src/SuvidhaPOS-Premium/Database/$script"
            if($LASTEXITCODE -ne 0){throw "$script failed on SQL Server 2019"}
          }
          $bak=(Resolve-Path 'database-artifact').Path+'\SuvidhaPos.bak'
          & $sqlcmd.FullName -I -S $server -E -b -Q "ALTER DATABASE [SuvidhaPOS] SET COMPATIBILITY_LEVEL = 150; BACKUP DATABASE [SuvidhaPOS] TO DISK=N'$bak' WITH INIT,COPY_ONLY,CHECKSUM; RESTORE VERIFYONLY FROM DISK=N'$bak' WITH CHECKSUM;"
          if($LASTEXITCODE -ne 0){throw 'SQL Server 2019 backup verification failed'}
          & $sqlcmd.FullName -I -S $server -E -b -Q "RESTORE HEADERONLY FROM DISK=N'$bak';"
          if($LASTEXITCODE -ne 0){throw 'Backup header validation failed'}
          Copy-Item $bak 'publish/desktop/win-x64/Database/SuvidhaPos.bak' -Force
      - name: Validate jewellery register transactions on isolated SQL database
        run: dotnet run --project fixes/JewelleryWorkflowChecks --configuration Release -- "Server=.\SQLEXPRESS2019;Integrated Security=true;TrustServerCertificate=true"
      - name: Validate administrator setup and Program Files install
        shell: powershell
        run: |
          $iss = Get-Content 'installer/SuvidhaPOS.iss' -Raw -Encoding UTF8
          foreach($token in @('PrivilegesRequired=admin','DefaultDirName={autopf}\SuvidhaPOS Premium','UsePreviousAppDir=no','Name: "{app}"; Permissions: users-modify','EnsureSqlExpress','IsSqlConnectionReady','WaitForSqlReady','SQLBOOTSTRAP:','MSSQL$SQLEXPRESS','SQL2019-SQLEXPR_x64_ENU.exe','OriginalWindowsUser','SQLSYSADMINACCOUNTS="BUILTIN\ADMINISTRATORS"','CanLaunchApplication','NeedRestart','runasoriginaluser')){ if(-not $iss.Contains($token)){ throw "Administrator/Program Files setup policy missing: $token" } }
          if($iss.Contains('PrivilegesRequired=lowest')){ throw 'Setup must request Administrator permission so {autopf} resolves to Program Files' }
          if($iss.Contains('Check: ShouldInstallSqlExpress')){ throw 'Legacy registry-only SQL install check must not be used' }
          if($iss -match 'SQL2019-SQLEXPR_x64_ENU\.exe.*skipifsilent'){ throw 'SQL Express must not be skipped during silent installation' }
          $helper = Get-Content 'installer/Ensure-SqlAccess.ps1' -Raw -Encoding UTF8
          foreach($token in @('MSSQL$SQLEXPRESS','CREATE LOGIN','ALTER SERVER ROLE [sysadmin] ADD MEMBER')){ if(-not $helper.Contains($token)){ throw "SQL access helper missing: $token" } }
          $license = Get-Content 'src/SuvidhaPOS-Premium/LicenseGuardModules.cs' -Raw -Encoding UTF8
          foreach($token in @('SpecialFolder.LocalApplicationData','DataProtectionScope.CurrentUser')){ if(-not $license.Contains($token)){ throw "Normal-user license cache policy missing: $token" } }
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: powershell
        run: '& ''C:\Program Files (x86)\Inno Setup 6\ISCC.exe'' installer/SuvidhaPOS.iss'
      - name: Validate installer
        shell: powershell
        run: |
          $installer=Get-ChildItem 'installer/installer-output/*.exe' | Select-Object -First 1
          if($null -eq $installer){throw 'Installer not generated'}
          Get-FileHash $installer.FullName -Algorithm SHA256
      - name: Publish rolling GitHub Release
        if: github.event_name != 'pull_request'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'latest-build'
          $installer = Get-ChildItem 'installer/installer-output/*.exe' | Select-Object -First 1
          if($null -eq $installer){ throw 'Installer not generated for release publishing' }
          $backup = Get-Item 'database-artifact/SuvidhaPos.bak' -ErrorAction Stop

          $releaseJson = gh release list --repo "${{ github.repository }}" --limit 100 --json tagName
          if($LASTEXITCODE -ne 0){ throw 'Unable to query existing GitHub releases' }
          $existing = @($releaseJson | ConvertFrom-Json | Where-Object { $_.tagName -eq $tag })
          if($existing.Count -gt 0){
            gh release delete $tag --repo "${{ github.repository }}" --cleanup-tag --yes
            if($LASTEXITCODE -ne 0){ throw 'Unable to replace previous latest-build release' }
          }

          gh release create $tag --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "SuvidhaPOS Premium Build #${{ github.run_number }}" --notes "Automated Windows installer and SQL Server 2019 compatible backup for commit ${{ github.sha }}." --prerelease
          if($LASTEXITCODE -ne 0){ throw 'Unable to create latest-build release' }

          gh release upload $tag $installer.FullName $backup.FullName --repo "${{ github.repository }}" --clobber
          if($LASTEXITCODE -ne 0){ throw 'Unable to upload installer/database backup to latest-build release' }

      - name: Validate release publishing policy
        shell: powershell
        run: |
          $wf = Get-Content '.github/workflows/build.yml' -Raw -Encoding UTF8
          if($wf -match '(?m)^\s*uses:\s*actions/upload-artifact@v4\s*$'){ throw 'Actions artifact storage must not be used by this workflow' }
          foreach($token in @('contents: write','Publish rolling GitHub Release','latest-build','gh release create','gh release upload')){ if(-not $wf.Contains($token)){ throw "Release publishing policy missing: $token" } }
