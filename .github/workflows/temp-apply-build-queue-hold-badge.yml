name: Temp Build Queue Patch
on:
  push:
    branches:
      - 'fix/build-queue-hold-badge-20260910'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'fix/build-queue-hold-badge-20260910'
      - name: Stage no-cancel workflow copy
        run: |
          sed 's/cancel-in-progress: true/cancel-in-progress: false/' .github/workflows/build.yml > build-patched.yml.txt
          grep -q 'cancel-in-progress: false' build-patched.yml.txt
          git config user.name 'infosuvidhapos'
          git config user.email 'info@suvidhapos.in'
          git add build-patched.yml.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Stage no-cancel build workflow'
          git push origin HEAD:fix/build-queue-hold-badge-20260910
