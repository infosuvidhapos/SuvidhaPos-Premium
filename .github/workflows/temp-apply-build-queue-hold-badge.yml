name: Temp Build Queue Patch
on:
  push:
    branches:
      - 'fix/build-queue-hold-badge-20260910'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'fix/build-queue-hold-badge-20260910'
      - name: Disable auto-cancel of running builds
        run: |
          sed -i 's/cancel-in-progress: true/cancel-in-progress: false/' .github/workflows/build.yml
          grep -q 'cancel-in-progress: false' .github/workflows/build.yml
          git config user.name 'infosuvidhapos'
          git config user.email 'info@suvidhapos.in'
          git add .github/workflows/build.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Keep running builds instead of auto-cancelling'
          git push origin HEAD:fix/build-queue-hold-badge-20260910
